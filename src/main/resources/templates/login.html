<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | ToDo</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=12)}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand"><span class="brand-mark">✓</span><span>やることリスト</span></div>
        <h1 class="page-title">ログイン</h1>
        <p class="login-error" th:if="${param.error}" role="alert">ユーザー名またはパスワードが正しくありません。</p>
        <p th:if="${param.logout}">ログアウトしました。</p>
        <form class="login-form" th:action="@{/login}" method="post" autocomplete="off">
            <div>
                <label for="username">ユーザー名</label>
                <input id="username" name="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required autofocus>
            </div>
            <div>
                <label for="password">パスワード</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">ログイン</button>
        </form>
    </main>
</body>
</html>
