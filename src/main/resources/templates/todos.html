<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
    <div class="container">
        <p class="flash" th:if="${message != null}" th:text="${message}"></p>
        <h1 class="page-title" th:text="${trash} ? '削除済みのやること' : 'やること一覧'">やること一覧</h1>
        <form class="search-bar" th:if="${!trash}" th:action="@{/todos}" method="get">
            <label>やることの名前
                <input type="text" name="keyword" th:value="${keyword}">
            </label>
            <label>ジャンル
                <select name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <label><input type="checkbox" name="includeCompleted" value="true" th:checked="${includeCompleted}"> 完了したものも表示する</label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc')}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc')}">期限が遠い順</a>
        </form>
        <a class="btn" th:if="${!trash}" th:href="@{/todos/new}">新規登録</a>
        <a class="link" th:if="${!trash}" th:href="@{/todos(trash=1)}">削除済みを見る</a>
        <a class="link" th:if="${trash}" th:href="@{/todos}">一覧に戻る</a>
        <a class="link" th:href="@{/calendar}">カレンダーで見る</a>

        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash} ? '削除済みのやることはありません' : 'まだ1件も登録されていません'">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-due-date=${todo.dueDate == null ? '' : #temporals.format(todo.dueDate, 'yyyy-MM-dd')}, data-completed=${todo.completed}">
                    <td>
                        <form th:if="${!trash}" th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post" class="pin-toggle-form">
                            <input type="hidden" name="pinned" th:value="${!todo.pinned}">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="category" th:value="${category}">
                            <input type="hidden" name="order" th:value="${order}">
                            <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
                            <input type="hidden" name="page" th:value="${page}">
                            <button class="pin-toggle" th:classappend="${todo.priority == 1} ? ' priority-marked'" type="submit" th:attr="aria-label=${todo.pinned} ? '先頭固定を外す' : '先頭に固定する', title=${todo.pinned} ? '先頭固定を外す' : '先頭に固定する'" th:text="${todo.pinned} ? '★' : '☆'">☆</button>
                        </form>
                        <span th:if="${trash}" th:text="${todo.pinned} ? '★' : '☆'">☆</span>
                        <span th:text="${todo.title}">やること</span>
                    </td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                        <span class="priority-marker" th:if="${todo.priority == 1}" aria-label="最優先">★</span>
                    </td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td><span th:if="${todo.completed}">&#23436;&#20102;<span th:if="${todo.completedAt != null}">（<span th:text="${#temporals.format(todo.completedAt, 'yyyy-MM-dd')}"></span>）</span></span><span th:unless="${todo.completed}">&#26410;&#23436;&#20102;</span></td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}">
                        <form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                            <button class="btn" type="submit">戻す</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" th:if="${!trash and totalPages > 1}" aria-label="ページ">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, page=${pageNumber})}"
               th:text="${pageNumber}" th:attr="aria-current=${pageNumber == page ? 'page' : null}"></a>
        </nav>
    </div>
    <script>
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        document.querySelectorAll('.todo-table tbody tr').forEach(row => {
            if (row.dataset.dueDate && row.dataset.dueDate < today && row.dataset.completed !== 'true') {
                row.classList.add('overdue');
            }
        });
    </script>
</body>
</html>
