<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${trash} ? '削除済みのやること' : 'やること一覧'">やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=10">
</head>
<body class="todos-page">
    <header class="app-header">
        <div class="app-brand"><span class="brand-mark">✓</span><span>やることリスト</span></div>
        <nav class="app-nav" aria-label="メインメニュー">
            <a class="active" th:href="@{/todos}"><span aria-hidden="true">☷</span> やること一覧</a>
            <a th:href="@{/calendar}"><span aria-hidden="true">▦</span> カレンダー</a>
            <a th:href="@{/dashboard}"><svg class="nav-chart-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 17V10h3v7M8.5 17V4h3v13M14 17V7h3v10M2 17.5h16"/></svg> 統計</a>
        </nav>
    </header>
    <main class="container todos-container">
        <p class="flash" th:if="${message != null}" th:text="${message}"></p>
        <header class="todos-heading">
            <span class="heading-icon" aria-hidden="true">✓</span>
            <div>
                <h1 class="page-title" th:text="${trash} ? '削除済みのやること' : 'やること一覧'">やること一覧</h1>
                <p>やることを登録・管理して、やりたいことを着実に進めましょう。</p>
            </div>
        </header>
        <form class="search-bar" th:if="${!trash}" th:action="@{/todos}" method="get">
            <label class="search-field">やることの名前
                <input type="text" name="keyword" th:value="${keyword}" placeholder="やることの名前を入力">
            </label>
            <label class="category-field">ジャンル
                <select name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <label class="completed-field"><input type="checkbox" name="includeCompleted" value="true" th:checked="${includeCompleted}"> 完了したものも表示する</label>
            <button class="btn filter-button" type="submit"><span aria-hidden="true">▽</span> 絞り込む</button>
        </form>
        <div class="sort-line" th:if="${!trash}">
            <span>並び替え：</span>
            <a class="link" th:classappend="${order == 'asc'} ? ' selected-sort'" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', includeCompleted=${includeCompleted})}">期限が近い順</a>
            <span class="sort-divider">|</span>
            <a class="link" th:classappend="${order == 'desc'} ? ' selected-sort'" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', includeCompleted=${includeCompleted})}">期限が遠い順</a>
        </div>
        <div class="todo-actions">
            <div class="primary-actions">
                <a class="btn" th:if="${!trash}" th:href="@{/todos/new}"><span aria-hidden="true">＋</span> 新規登録</a>
                <a class="btn btn-secondary" th:if="${!trash}" th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted})}">▤ CSVで書き出す</a>
                <a class="link utility-link" th:if="${trash}" th:href="@{/todos}">一覧に戻る</a>
            </div>
            <div class="utility-actions">
                <a class="link utility-link" th:if="${!trash}" th:href="@{/todos(trash=1)}">▤ 削除済みを見る</a>
                <a class="link utility-link" th:if="${!trash}" th:href="@{/calendar}">▣ カレンダーで見る</a>
            </div>
        </div>
        <p class="empty-state" th:if="${#lists.isEmpty(todos)}" th:text="${trash} ? '削除済みのやることはありません' : 'まだやることが登録されていません'">まだやることが登録されていません</p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(todos)}">
            <table class="todo-table">
                <thead><tr><th>やること <span>↕</span></th><th>ジャンル <span>↕</span></th><th>優先度 <span>↕</span></th><th>期限 <span>↕</span></th><th>状態 <span>↕</span></th><th>操作</th></tr></thead>
                <tbody>
                    <tr th:each="todo : ${todos}"
                        th:classappend="${todo.completed != true and todo.expired} ? ' overdue' : (${todo.completed != true and todo.dueDateSoon} ? ' due-soon' : '')">
                        <td class="todo-name">
                            <form th:if="${!trash}" th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post" class="pin-toggle-form">
                                <input type="hidden" name="pinned" th:value="${!todo.pinned}"><input type="hidden" name="keyword" th:value="${keyword}"><input type="hidden" name="category" th:value="${category}"><input type="hidden" name="order" th:value="${order}"><input type="hidden" name="includeCompleted" th:value="${includeCompleted}"><input type="hidden" name="page" th:value="${page}">
                                <button class="pin-toggle" th:classappend="${todo.pinned} ? ' priority-marked'" type="submit" th:attr="aria-label=${todo.pinned} ? '優先固定を解除' : '優先に固定', title=${todo.pinned} ? '優先固定を解除' : '優先に固定'" th:text="${todo.pinned} ? '★' : '☆'">☆</button>
                            </form>
                            <span class="pin-toggle" th:if="${trash}" th:text="${todo.pinned} ? '★' : '☆'">☆</span>
                            <span th:text="${todo.title}">やること</span>
                        </td>
                        <td><span class="category-badge" th:text="${todo.category}" th:classappend="${todo.category == 'プログラミング'} ? ' category-blue' : (${todo.category == '資格'} ? ' category-green' : (${todo.category == '就職活動'} ? ' category-purple' : ' category-neutral'))">ジャンル</span></td>
                        <td><span class="priority-badge" th:classappend="${todo.priority == 1} ? ' priority-high' : (${todo.priority == 2} ? ' priority-medium' : ' priority-low')" th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">中</span></td>
                        <td class="deadline-cell">
                            <span class="deadline-warning deadline-expired" th:if="${todo.completed != true and todo.expired}">
                                ⚠ 期限切れ：<span th:text="${#temporals.format(todo.dueDate, 'yyyy/MM/dd')}">2024/01/10</span>
                            </span>
                            <span class="deadline-warning deadline-soon" th:if="${todo.completed != true and todo.dueDateSoon}">
                                ⏰ あと<span th:text="${todo.daysUntilDueDate}">2</span>日：<span th:text="${#temporals.format(todo.dueDate, 'yyyy/MM/dd')}">2024/01/20</span>
                            </span>
                            <span class="deadline-normal" th:if="${todo.dueDate != null and (todo.completed == true or (!todo.expired and !todo.dueDateSoon))}">
                                ▣ <span th:text="${#temporals.format(todo.dueDate, 'yyyy/MM/dd')}">2024/02/15</span>
                            </span>
                            <span th:if="${todo.dueDate == null}">—</span>
                        </td>
                        <td><span class="status-badge" th:if="${todo.completed}">完了<span th:if="${todo.completedAt != null}" th:text="${' ・ ' + #temporals.format(todo.completedAt, 'yyyy-MM-dd')}"></span></span><span class="status-badge" th:unless="${todo.completed}">未完了</span></td>
                        <td class="row-actions" th:if="${!trash}"><a class="link edit-link" th:href="@{/todos/{id}/edit(id=${todo.id})}">✎ 編集</a><a class="link delete-link" th:href="@{/todos/{id}/delete(id=${todo.id})}">▤ 削除</a></td>
                        <td th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="btn" type="submit">復元</button></form></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination" th:if="${!trash and totalPages > 1}" aria-label="ページ">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}" th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, page=${pageNumber})}" th:text="${pageNumber}" th:attr="aria-current=${pageNumber == page ? 'page' : null}"></a>
        </nav>
    </main>
</body>
</html>
