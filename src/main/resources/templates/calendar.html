<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
</head>
<body>
    <main class="container calendar-page">
        <h1 class="page-title" th:text="${selectedMonth.year} + '年' + ${selectedMonth.monthValue} + '月'">2026年4月</h1>
        <nav class="calendar-navigation" aria-label="月の移動">
            <a class="btn sub" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前の月</a>
            <a class="btn sub" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次の月</a>
        </nav>
        <table class="calendar-table" th:attr="data-from=${#temporals.format(firstDay, 'yyyy-MM-dd')}, data-to=${#temporals.format(lastDay, 'yyyy-MM-dd')}">
            <thead>
                <tr>
                    <th scope="col">日</th><th scope="col">月</th><th scope="col">火</th><th scope="col">水</th><th scope="col">木</th><th scope="col">金</th><th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="weekStart : ${#numbers.sequence(0, dates.size() - 1, 7)}">
                    <td th:each="offset : ${#numbers.sequence(0, 6)}"
                        th:with="date=${dates[weekStart + offset]}"
                        th:attr="data-date=${date == null ? null : #temporals.format(date, 'yyyy-MM-dd')}">
                        <span th:if="${date != null}" th:text="${date.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
<script>
    async function showTodosInCalendar() {
        const table = document.querySelector('.calendar-table');
        const from = table.dataset.from;
        const to = table.dataset.to;
        const params = new URLSearchParams({ from, to });
        const res = await fetch(`/api/todos?${params}`);
        const todos = await res.json();

        document.querySelectorAll('.calendar-table td[data-date]').forEach(cell => {
            todos
                .filter(todo => todo.dueDate === cell.dataset.date)
                .forEach(todo => {
                    const name = document.createElement('div');
                    name.textContent = todo.title;
                    cell.appendChild(name);
                });
        });
    }

    showTodosInCalendar();
</script>
</body>
</html>
