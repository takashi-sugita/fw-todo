<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
</head>
<body>
    <header class="app-header">
        <div class="app-brand"><span class="brand-mark">✓</span><span>やることリスト</span></div>
        <nav class="app-nav" aria-label="メインメニュー">
            <a th:href="@{/todos}"><span aria-hidden="true">☷</span> やること一覧</a>
            <a class="active" th:href="@{/calendar}"><span aria-hidden="true">▦</span> カレンダー</a>
            <a th:href="@{/dashboard}"><svg class="nav-chart-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 17V10h3v7M8.5 17V4h3v13M14 17V7h3v10M2 17.5h16"/></svg> 統計</a>
        </nav>
    </header>
    <main class="container calendar-page">
        <div class="calendar-heading">
            <span class="heading-icon" aria-hidden="true">▦</span>
            <div>
                <h1 class="page-title" th:if="${!weekView}" th:text="${selectedMonth.year} + '年' + ${selectedMonth.monthValue} + '月'">2026年4月</h1>
                <h1 class="page-title" th:if="${weekView}" th:text="${#temporals.format(firstDay, 'yyyy年M月d日')} + ' ～ ' + ${#temporals.format(lastDay, 'M月d日')}">2026年4月5日 ～ 4月11日</h1>
                <p>期限や予定をカレンダーで確認しましょう。</p>
            </div>
        </div>
        <nav class="calendar-navigation" aria-label="カレンダーの移動">
            <div class="calendar-month-links">
                <a class="btn sub" th:if="${!weekView}" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前の月</a>
                <a class="btn sub" th:if="${!weekView}" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次の月</a>
                <a class="btn sub" th:if="${weekView}" th:href="@{/calendar(view='week', date=${firstDay.minusDays(7)})}">前の週</a>
                <a class="btn sub" th:if="${weekView}" th:href="@{/calendar(view='week', date=${firstDay.plusDays(7)})}">次の週</a>
                <a class="btn sub" th:if="${!weekView}" th:href="@{/calendar(view='week', date=${firstDay})}">週で見る</a>
                <a class="btn sub" th:if="${weekView}" th:href="@{/calendar(year=${selectedMonth.year}, month=${selectedMonth.monthValue})}">月で見る</a>
            </div>
            <div class="calendar-page-links">
                <a class="btn sub" th:href="@{/todos}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:attr="data-from=${#temporals.format(firstDay, 'yyyy-MM-dd')}, data-to=${#temporals.format(lastDay, 'yyyy-MM-dd')}, data-view=${weekView ? 'week' : 'month'}">
            <thead>
                <tr>
                    <th scope="col">日</th><th scope="col">月</th><th scope="col">火</th><th scope="col">水</th><th scope="col">木</th><th scope="col">金</th><th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="weekStart : ${#numbers.sequence(0, dates.size() - 1, 7)}">
                    <td th:each="offset : ${#numbers.sequence(0, 6)}"
                        th:with="date=${dates[weekStart + offset]}"
                        th:classappend="${date == null ? 'outside-month' : ''}"
                        th:attr="data-date=${date == null ? null : #temporals.format(date, 'yyyy-MM-dd')}">
                        <span class="calendar-day-number" th:if="${date != null}" th:text="${date.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
<script>
    async function showTodosInCalendar() {
        const table = document.querySelector('.calendar-table');
        const from = table.dataset.from;
        const to = table.dataset.to;
        const params = new URLSearchParams({ from, to });
        const res = await fetch(`/api/todos?${params}`);
        const todos = await res.json();
        const holidayRes = await fetch(`/api/holidays?${params}`);
        const holidays = await holidayRes.json();
        let weather = {};
        try {
            const weatherRes = await fetch('/api/weather');
            weather = await weatherRes.json();
        } catch (error) {
            // 天気が取得できなくても、予定とカレンダーの表示は続けます。
        }
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        function weatherIconFor(label) {
            if (label.startsWith('快晴') || label.startsWith('晴れ')) return '☀️';
            if (label.startsWith('一部曇り')) return '🌤️';
            if (label.startsWith('曇り')) return '☁️';
            if (label.startsWith('霧雨') || label.startsWith('にわか雨')) return '🌦️';
            if (label.startsWith('霧')) return '🌫️';
            if (label.startsWith('雨')) return '🌧️';
            if (label.startsWith('雪') || label.startsWith('にわか雪')) return '❄️';
            if (label.startsWith('雷雨')) return '⛈️';
            return '🌡️';
        }

        if (holidayRes.headers.has('X-Holidays-Unavailable')) {
            const message = document.createElement('div');
            message.textContent = '祝日を取れませんでした';
            document.body.insertBefore(message, document.body.firstChild);
        }

        document.querySelectorAll('.calendar-table td[data-date]').forEach(cell => {
            const [year, month, day] = cell.dataset.date.split('-').map(Number);
            const weekday = new Date(year, month - 1, day).getDay();
            if (Object.hasOwn(weather, cell.dataset.date)) {
                const label = weather[cell.dataset.date];
                const weatherLabel = document.createElement('span');
                weatherLabel.className = 'calendar-weather';
                weatherLabel.title = label;
                weatherLabel.setAttribute('aria-label', label);
                const icon = document.createElement('span');
                icon.className = 'calendar-weather-icon';
                icon.setAttribute('aria-hidden', 'true');
                icon.textContent = weatherIconFor(label);
                weatherLabel.appendChild(icon);
                const temperatures = label.match(/\d+°\/\d+°$/);
                if (temperatures) {
                    const temperatureLabel = document.createElement('span');
                    temperatureLabel.className = 'calendar-weather-temperature';
                    temperatureLabel.textContent = temperatures[0];
                    weatherLabel.appendChild(temperatureLabel);
                }
                cell.appendChild(weatherLabel);
            }
            if (Object.hasOwn(holidays, cell.dataset.date)) {
                cell.classList.add('holiday');
                cell.title = holidays[cell.dataset.date];
            } else if (weekday === 6) {
                cell.classList.add('saturday');
            } else if (weekday === 0) {
                cell.classList.add('sunday');
            }
            if (cell.dataset.date === today) cell.classList.add('today');

            const cellTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
            const todoList = document.createElement('div');
            const visibleTodos = table.dataset.view === 'week' ? cellTodos : cellTodos.slice(0, 3);
            visibleTodos.forEach(todo => {
                    const name = document.createElement('a');
                    name.href = `/todos/${todo.id}/edit`;
                    name.textContent = todo.title;
                    name.className = 'calendar-todo';
                    if (todo.dueDate < today && todo.completed !== true) {
                        name.classList.add('overdue');
                    }
                    todoList.appendChild(name);
                });

            if (table.dataset.view !== 'week' && cellTodos.length > 3) {
                const more = document.createElement('div');
                more.textContent = `ほか ${cellTodos.length - 3}件`;
                todoList.appendChild(more);
            }
            if (todoList.childElementCount > 0) {
                cell.appendChild(todoList);
            }
        });
    }

    showTodosInCalendar();
</script>
</body>
</html>
