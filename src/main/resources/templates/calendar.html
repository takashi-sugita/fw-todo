<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
</head>
<body>
    <main class="container calendar-page">
        <h1 class="page-title" th:text="${selectedMonth.year} + '年' + ${selectedMonth.monthValue} + '月'">2026年4月</h1>
        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-month-links">
                <a class="btn sub" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前の月</a>
                <a class="btn sub" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次の月</a>
            </div>
            <div class="calendar-page-links">
                <a class="btn sub" th:href="@{/todos}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:attr="data-from=${#temporals.format(firstDay, 'yyyy-MM-dd')}, data-to=${#temporals.format(lastDay, 'yyyy-MM-dd')}">
            <thead>
                <tr>
                    <th scope="col">日</th><th scope="col">月</th><th scope="col">火</th><th scope="col">水</th><th scope="col">木</th><th scope="col">金</th><th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="weekStart : ${#numbers.sequence(0, dates.size() - 1, 7)}">
                    <td th:each="offset : ${#numbers.sequence(0, 6)}"
                        th:with="date=${dates[weekStart + offset]}"
                        th:attr="data-date=${date == null ? null : #temporals.format(date, 'yyyy-MM-dd')}">
                        <span th:if="${date != null}" th:text="${date.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
<script>
    async function showTodosInCalendar() {
        const table = document.querySelector('.calendar-table');
        const from = table.dataset.from;
        const to = table.dataset.to;
        const params = new URLSearchParams({ from, to });
        const res = await fetch(`/api/todos?${params}`);
        const todos = await res.json();
        const holidayRes = await fetch(`/api/holidays?${params}`);
        const holidays = await holidayRes.json();
        let weather = {};
        try {
            const weatherRes = await fetch('/api/weather');
            weather = await weatherRes.json();
        } catch (error) {
            // 天気が取得できなくても、予定とカレンダーの表示は続けます。
        }
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        if (holidayRes.headers.has('X-Holidays-Unavailable')) {
            const message = document.createElement('div');
            message.textContent = '祝日を取れませんでした';
            document.body.insertBefore(message, document.body.firstChild);
        }

        document.querySelectorAll('.calendar-table td[data-date]').forEach(cell => {
            const [year, month, day] = cell.dataset.date.split('-').map(Number);
            const weekday = new Date(year, month - 1, day).getDay();
            if (Object.hasOwn(weather, cell.dataset.date)) {
                const weatherLabel = document.createElement('span');
                weatherLabel.textContent = weather[cell.dataset.date];
                weatherLabel.className = 'calendar-weather';
                weatherLabel.style.fontSize = '0.6em';
                weatherLabel.style.marginLeft = '0.4em';
                weatherLabel.style.whiteSpace = 'nowrap';
                cell.appendChild(weatherLabel);
            }
            if (Object.hasOwn(holidays, cell.dataset.date)) {
                cell.style.backgroundColor = '#fff0cc';
                cell.title = holidays[cell.dataset.date];
            } else if (weekday === 6) {
                cell.style.backgroundColor = '#e8f1ff';
            } else if (weekday === 0) {
                cell.style.backgroundColor = '#ffe8e8';
            }

            const cellTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
            const todoList = document.createElement('div');
            cellTodos.slice(0, 3).forEach(todo => {
                    const name = document.createElement('a');
                    name.href = `/todos/${todo.id}/edit`;
                    name.textContent = todo.title;
                    name.style.color = 'inherit';
                    name.style.display = 'block';
                    if (todo.dueDate < today && todo.completed !== true) {
                        name.style.color = 'red';
                    }
                    todoList.appendChild(name);
                });

            if (cellTodos.length > 3) {
                const more = document.createElement('div');
                more.textContent = `ほか ${cellTodos.length - 3}件`;
                todoList.appendChild(more);
            }
            if (todoList.childElementCount > 0) {
                cell.appendChild(todoList);
            }
        });
    }

    showTodosInCalendar();
</script>
</body>
</html>
