<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除確認</title>
    <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body class="todos-page form-page">
    <main class="container form-card">
        <h1 class="page-title">このやることを削除しますか？</h1>
        <p class="confirm-value">
            やること：<span th:text="${todo.title}">やること</span>　
            ジャンル：<span th:text="${todo.category}">ジャンル</span>　
            期限：<span th:text="${todo.dueDate}">期限</span>
        </p>
        <div class="confirm-actions">
            <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                <button class="btn" type="submit">消す</button>
            </form>
            <a class="btn sub" th:href="@{/todos}">やめる</a>
        </div>
    </main>
</body>
</html>
